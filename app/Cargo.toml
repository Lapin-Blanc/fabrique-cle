[package]
name = "fabrique-cle"
version = "0.1.0"
description = "Fabrique une clé USB Debian 13 + KDE Plasma amorçable et personnalisée"
publish = false
edition = "2024"

[dependencies]
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
fatfs = "0.3.6"
getrandom = "0.4.3"
hex = "0.4.3"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha-crypt = "0.6.0"
sha2 = "0.11.1"
ureq = { version = "3.5.0", features = ["platform-verifier", "win-system-proxy"] }
zstd = "0.14.3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_SystemInformation", "Win32_Security"] }

[build-dependencies]
embed-manifest = "1.5.1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
