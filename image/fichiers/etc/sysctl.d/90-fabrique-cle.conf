# Fabrique-Clé — système sur clé USB (souvent lente en écriture).
# Écriture différée bornée : sans cela, Linux accumule jusqu'à ~20 % de la RAM à écrire et le bureau
# se fige pendant que la clé les vide. Sans effet notable sur un SSD USB rapide.
vm.dirty_background_bytes = 16777216
vm.dirty_bytes = 67108864
# zram (swap compressé en RAM) : l'utiliser volontiers, page par page
vm.swappiness = 150
vm.page-cluster = 0
# Garder plus longtemps en mémoire les répertoires et inodes (moins de lectures sur la clé)
vm.vfs_cache_pressure = 50
