# Publie une version : étiquette sur main, release en pré-version, puis construction + test de l'image
# et compilation de l'application, jointes à la release.
#
# Lancé à la main (Actions → « Publier une version » → Run workflow) ou par Claude Code.
# APPROBATION : le job « etiquette » utilise l'environnement GitHub « release ». Dans
# Settings → Environments → release, la règle « Required reviewers » (l'enseignant) fait attendre
# chaque publication jusqu'au clic « Approve ». Sans cette règle, la publication part sans attendre.
#
# Remarque : une étiquette posée par un workflow ne déclenche pas les autres workflows (protection
# de GitHub contre les boucles) : image.yml et app.yml sont donc appelés directement ci-dessous.
name: Publier une version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Étiquette à publier, ex. v2026.11.2 (format vAAAA.MM ou vAAAA.MM.N)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publier
  cancel-in-progress: false

jobs:
  etiquette:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Étiquette et release (pré-version)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]{4}\.[0-9]{2}(\.[0-9]+)?$'; then
            echo "::error::Version « $VERSION » invalide : attendu vAAAA.MM ou vAAAA.MM.N"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::L'étiquette $VERSION existe déjà"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Fabrique-Clé $VERSION" "$(git rev-parse origin/main)"
          git push origin "refs/tags/$VERSION"
          gh release create "$VERSION" --verify-tag --prerelease --title "Fabrique-Clé $VERSION" \
            --generate-notes \
            --notes "Image Debian 13 + KDE Plasma (léger), testée dans QEMU avec Secure Boot, et application Fabrique-Clé (Windows : fabrique-cle-windows.exe ; Linux : fabrique-cle-linux-x86_64.AppImage). Pré-version : à valider sur vrai matériel, puis décocher « pre-release » sur GitHub."
          echo "Étiquette $VERSION posée sur $(git rev-parse --short origin/main), release créée." >> "$GITHUB_STEP_SUMMARY"

  image:
    needs: etiquette
    uses: ./.github/workflows/image.yml
    with:
      version: ${{ inputs.version }}

  application:
    needs: etiquette
    uses: ./.github/workflows/app.yml
    with:
      version: ${{ inputs.version }}
